<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141d2b"><title>La Isla de los Ecos · Aventura pixel art</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head>
<body><header><div class="wrap mast"><a class="brand" href="#inicio" aria-label="La Isla de los Ecos, inicio"><canvas id="crest" width="40" height="40"></canvas><span>LA ISLA <b>DE LOS ECOS</b></span></a><div class="tools"><button id="codexBtn" class="chrome"><span aria-hidden="true">▤</span> Códice</button><button id="soundBtn" class="chrome icon" aria-label="Cambiar volumen" title="Volumen"><canvas id="soundIcon" width="18" height="18"></canvas></button><button id="fullBtn" class="chrome icon" aria-label="Pantalla completa" title="Pantalla completa">⛶</button></div></div></header>
<main id="inicio" class="wrap"><div id="gameView"><div class="screenBar"><button id="leaveFull" class="chrome" type="button">⛶ Salir de pantalla completa</button></div><div class="frame"><section class="stage" aria-label="Escenario de juego"><canvas id="scene" width="640" height="336" aria-label="Mapa y arena de La Isla de los Ecos" tabindex="0"></canvas><div id="cover"><div class="coverText"><h1>LA ISLA<br><strong>DE LOS ECOS</strong></h1><p>Una isla, cuatro regiones y un rey<br class="wide"> que aprende de cada combate.</p><button id="start" class="gold"><span>▶</span> <span id="startLabel">Comenzar aventura</span></button></div></div>
<div id="hud" hidden><div id="speech" role="status" aria-live="polite" hidden><strong id="speaker"></strong><span id="spoken"></span></div><div class="vitals"><div><b>VIDA</b><i><em id="hp"></em></i><small id="lifeText"></small></div><div><b>ENERGÍA</b><i><em id="sp"></em></i></div></div><button id="pauseBtn" class="chrome icon" title="Pausa" aria-label="Pausa">Ⅱ</button><div class="region" id="region"></div><div id="enemyHud" hidden><span id="enemyName"></span><i><em id="enemyHP"></em></i><strong id="royalPhase" hidden></strong><small id="prediction"></small></div><div class="belt" aria-label="Inventario" role="group"><div id="gearSlots" class="slots gear" role="group" aria-label="Armas"></div><div id="bagSlots" class="slots bag" role="group" aria-label="Consumibles"></div><button id="useBtn" title="Usar consumible [E]">Usar</button></div><output id="toast" aria-live="polite"></output></div>
<dialog id="modal" aria-labelledby="dialogTitle">
  <div class="dialogHead">
    <canvas id="menuArt" width="288" height="96" aria-hidden="true"></canvas>
    <div class="menuHeading"><p id="dialogTag"></p><h2 id="dialogTitle" tabindex="-1"></h2></div>
    <button class="chrome icon" id="close" type="button" aria-label="Cerrar menú">×</button>
  </div>
  <div id="dialogBody"></div>
  <div id="dialogActions"></div>
</dialog></section></div>
<div class="touch" id="touch" hidden><div class="pad"><button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><div><button data-key="KeyJ">Acción</button><button data-key="Space">Rodar</button></div></div>
</div><section class="route"><div class="sectionHead"><h2><span class="diamond"></span> Ruta de la isla</h2></div><div id="zones"></div></section>
<footer><div><kbd>WASD</kbd> Mover <kbd>J</kbd> Atacar <kbd>ESP</kbd> Esquivar</div><span><i></i> <span id="saveState">Guardado local</span></span></footer></main>
<script type="module" src="game.js"></script></body></html>
